---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: analyses.quicksight.services.k8s.aws
spec:
  group: quicksight.services.k8s.aws
  names:
    kind: Analysis
    listKind: AnalysisList
    plural: analyses
    singular: analysis
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Analysis is the Schema for the Analyses API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              AnalysisSpec defines the desired state of Analysis.

              Metadata structure for an analysis in Quick Sight
            properties:
              awsAccountID:
                description: |-
                  The ID of the Amazon Web Services account where you are creating an analysis.

                  Regex Pattern: `^[0-9]{12}$`
                type: string
                x-kubernetes-validations:
                - message: Value is immutable once set
                  rule: self == oldSelf
              folderARNs:
                description: |-
                  When you create the analysis, Amazon Quick Sight adds the analysis to these
                  folders.
                items:
                  type: string
                type: array
              id:
                description: |-
                  The ID for the analysis that you're creating. This ID displays in the URL
                  of the analysis.

                  Regex Pattern: `^[\w\-]+$`
                type: string
                x-kubernetes-validations:
                - message: Value is immutable once set
                  rule: self == oldSelf
              name:
                description: |-
                  A descriptive name for the analysis that you're creating. This name displays
                  for the analysis in the Amazon Quick Sight console.
                type: string
              parameters:
                description: |-
                  The parameter names and override values that you want to use. An analysis
                  can have any parameter type, and some parameters might accept multiple values.
                properties:
                  dateTimeParameters:
                    items:
                      description: A date-time parameter.
                      properties:
                        name:
                          type: string
                        values:
                          items:
                            format: date-time
                            type: string
                          type: array
                      type: object
                    type: array
                  decimalParameters:
                    items:
                      description: A decimal parameter.
                      properties:
                        name:
                          type: string
                        values:
                          items:
                            type: number
                          type: array
                      type: object
                    type: array
                  integerParameters:
                    items:
                      description: An integer parameter.
                      properties:
                        name:
                          type: string
                        values:
                          items:
                            format: int64
                            type: integer
                          type: array
                      type: object
                    type: array
                  stringParameters:
                    items:
                      description: A string parameter.
                      properties:
                        name:
                          type: string
                        values:
                          items:
                            type: string
                          type: array
                      type: object
                    type: array
                type: object
              permissions:
                description: |-
                  A structure that describes the principals and the resource-level permissions
                  on an analysis. You can use the Permissions structure to grant permissions
                  by providing a list of Identity and Access Management (IAM) action information
                  for each principal listed by Amazon Resource Name (ARN).

                  To specify no permissions, omit Permissions.
                items:
                  description: Permission for the resource.
                  properties:
                    actions:
                      items:
                        type: string
                      type: array
                    principal:
                      type: string
                  type: object
                type: array
              sourceEntity:
                description: |-
                  A source entity to use for the analysis that you're creating. This metadata
                  structure contains details that describe a source template and one or more
                  datasets.

                  Either a SourceEntity or a Definition must be provided in order for the request
                  to be valid.
                properties:
                  sourceTemplate:
                    description: The source template of an analysis.
                    properties:
                      arn:
                        type: string
                      dataSetReferences:
                        items:
                          description: Dataset reference.
                          properties:
                            dataSetARN:
                              type: string
                            dataSetPlaceholder:
                              type: string
                          type: object
                        type: array
                    type: object
                type: object
              tags:
                description: |-
                  Contains a map of the key-value pairs for the resource tag or tags assigned
                  to the analysis.
                items:
                  description: |-
                    The key or keys of the key-value pairs for the resource tag or tags assigned
                    to the resource.
                  properties:
                    key:
                      type: string
                    value:
                      type: string
                  type: object
                type: array
              themeARN:
                description: |-
                  The ARN for the theme to apply to the analysis that you're creating. To see
                  the theme in the Amazon Quick Sight console, make sure that you have access
                  to it.
                type: string
              validationStrategy:
                description: |-
                  The option to relax the validation needed to create an analysis with definition
                  objects. This skips the validation step for specific errors.
                properties:
                  mode:
                    type: string
                type: object
            required:
            - awsAccountID
            - id
            - name
            type: object
          status:
            description: AnalysisStatus defines the observed state of Analysis
            properties:
              ackResourceMetadata:
                description: |-
                  All CRs managed by ACK have a common `Status.ACKResourceMetadata` member
                  that is used to contain resource sync state, account ownership,
                  constructed ARN for the resource
                properties:
                  arn:
                    description: |-
                      ARN is the Amazon Resource Name for the resource. This is a
                      globally-unique identifier and is set only by the ACK service controller
                      once the controller has orchestrated the creation of the resource OR
                      when it has verified that an "adopted" resource (a resource where the
                      ARN annotation was set by the Kubernetes user on the CR) exists and
                      matches the supplied CR's Spec field values.
                      https://github.com/aws/aws-controllers-k8s/issues/270
                    type: string
                  ownerAccountID:
                    description: |-
                      OwnerAccountID is the AWS Account ID of the account that owns the
                      backend AWS service API resource.
                    type: string
                  region:
                    description: Region is the AWS region in which the resource exists
                      or will exist.
                    type: string
                required:
                - ownerAccountID
                - region
                type: object
              conditions:
                description: |-
                  All CRs managed by ACK have a common `Status.Conditions` member that
                  contains a collection of `ackv1alpha1.Condition` objects that describe
                  the various terminal states of the CR and its backend AWS service API
                  resource
                items:
                  description: |-
                    Condition is the common struct used by all CRDs managed by ACK service
                    controllers to indicate terminal states  of the CR and its backend AWS
                    service API resource
                  properties:
                    lastTransitionTime:
                      description: Last time the condition transitioned from one status
                        to another.
                      format: date-time
                      type: string
                    message:
                      description: A human readable message indicating details about
                        the transition.
                      type: string
                    reason:
                      description: The reason for the condition's last transition.
                      type: string
                    status:
                      description: Status of the condition, one of True, False, Unknown.
                      type: string
                    type:
                      description: Type is the type of the Condition
                      type: string
                  required:
                  - status
                  - type
                  type: object
                type: array
              createdTime:
                description: The time that the analysis was created.
                format: date-time
                type: string
              dataSetARNs:
                description: The ARNs of the datasets of the analysis.
                items:
                  type: string
                type: array
              errors:
                description: Errors associated with the analysis.
                items:
                  description: Analysis error.
                  properties:
                    message:
                      type: string
                    type:
                      type: string
                    violatedEntities:
                      items:
                        description: An object, structure, or sub-structure of an
                          analysis, template, or dashboard.
                        properties:
                          path:
                            type: string
                        type: object
                      type: array
                  type: object
                type: array
              lastUpdatedTime:
                description: The time that the analysis was last updated.
                format: date-time
                type: string
              sheets:
                description: |-
                  A list of the associated sheets with the unique identifier and name of each
                  sheet.
                items:
                  description: |-
                    A sheet, which is an object that contains a set of visuals that are viewed
                    together on one page in Quick Sight. Every analysis and dashboard contains
                    at least one sheet. Each sheet contains at least one visualization widget,
                    for example a chart, pivot table, or narrative insight. Sheets can be associated
                    with other components, such as controls, filters, and so on.
                  properties:
                    images:
                      items:
                        description: An image that is located on a sheet.
                        properties:
                          actions:
                            items:
                              description: A custom action defined on an image.
                              properties:
                                actionOperations:
                                  items:
                                    description: |-
                                      The operation that is defined by the custom action.

                                      This is a union type structure. For this structure to be valid, only one
                                      of the attributes can be defined.
                                    properties:
                                      navigationOperation:
                                        description: |-
                                          The navigation operation that navigates between different sheets in the same
                                          analysis.

                                          This is a union type structure. For this structure to be valid, only one
                                          of the attributes can be defined.
                                        properties:
                                          localNavigationConfiguration:
                                            description: The navigation configuration
                                              for CustomActionNavigationOperation.
                                            properties:
                                              targetSheetID:
                                                type: string
                                            type: object
                                        type: object
                                      setParametersOperation:
                                        description: The set parameter operation that
                                          sets parameters in custom action.
                                        properties:
                                          parameterValueConfigurations:
                                            items:
                                              description: The configuration of adding
                                                parameters in action.
                                              properties:
                                                destinationParameterName:
                                                  type: string
                                                value:
                                                  description: |-
                                                    The configuration of destination parameter values.

                                                    This is a union type structure. For this structure to be valid, only one
                                                    of the attributes can be defined.
                                                  properties:
                                                    customValuesConfiguration:
                                                      description: The configuration
                                                        of custom values for the destination
                                                        parameter in DestinationParameterValueConfiguration.
                                                      properties:
                                                        customValues:
                                                          description: |-
                                                            The customized parameter values.

                                                            This is a union type structure. For this structure to be valid, only one
                                                            of the attributes can be defined.
                                                          properties:
                                                            dateTimeValues:
                                                              items:
                                                                format: date-time
                                                                type: string
                                                              type: array
                                                            decimalValues:
                                                              items:
                                                                type: number
                                                              type: array
                                                            integerValues:
                                                              items:
                                                                format: int64
                                                                type: integer
                                                              type: array
                                                            stringValues:
                                                              items:
                                                                type: string
                                                              type: array
                                                          type: object
                                                        includeNullValue:
                                                          type: boolean
                                                      type: object
                                                    selectAllValueOptions:
                                                      type: string
                                                    sourceColumn:
                                                      description: A column of a data
                                                        set.
                                                      properties:
                                                        columnName:
                                                          type: string
                                                        dataSetIdentifier:
                                                          type: string
                                                      type: object
                                                    sourceField:
                                                      type: string
                                                    sourceParameterName:
                                                      type: string
                                                  type: object
                                              type: object
                                            type: array
                                        type: object
                                      urlOperation:
                                        description: The URL operation that opens
                                          a link to another webpage.
                                        properties:
                                          urlTarget:
                                            type: string
                                          urlTemplate:
                                            type: string
                                        type: object
                                    type: object
                                  type: array
                                customActionID:
                                  type: string
                                name:
                                  type: string
                                status:
                                  type: string
                                trigger:
                                  type: string
                              type: object
                            type: array
                          imageContentAltText:
                            type: string
                          interactions:
                            description: The general image interactions setup for
                              image publish options.
                            properties:
                              imageMenuOption:
                                description: The menu options for the interactions
                                  of an image.
                                properties:
                                  availabilityStatus:
                                    type: string
                                type: object
                            type: object
                          scaling:
                            description: Determines how the image is scaled
                            properties:
                              scalingType:
                                type: string
                            type: object
                          sheetImageID:
                            type: string
                          source:
                            description: The source of the image.
                            properties:
                              sheetImageStaticFileSource:
                                description: The source of the static file that contains
                                  the image.
                                properties:
                                  staticFileID:
                                    type: string
                                type: object
                            type: object
                          tooltip:
                            description: The tooltip configuration for a sheet image.
                            properties:
                              tooltipText:
                                description: The text that appears in the sheet image
                                  tooltip.
                                properties:
                                  plainText:
                                    type: string
                                type: object
                              visibility:
                                type: string
                            type: object
                        type: object
                      type: array
                    name:
                      type: string
                    sheetID:
                      type: string
                  type: object
                type: array
              status:
                description: Status associated with the analysis.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
